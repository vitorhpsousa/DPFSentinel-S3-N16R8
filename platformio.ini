; DPF Sentinel — ESP32-S3 OBD logger. One board:
;   pio run -t upload   build and flash (Freenove ESP32-S3 N16R8, no screen, SD only)
;   pio test -e native    host-side unit tests (decoders, ISO-TP)
[platformio]
default_envs = freenove

[esp32]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

[env:freenove]
extends = esp32
build_flags = ${esp32.build_flags} -D BOARD_FREENOVE=1
build_src_filter = +<*> -<audio/> -<board/> -<input/> -<ui/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*> +<obd/pid_decode.cpp> +<obd/isotp.cpp>
test_build_src = yes
